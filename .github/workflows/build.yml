name: Build Windows and Mac apps

on:
  push:
    branches: [main]
  release:
    types: [published]      # publishing a release on GitHub builds and attaches the apps
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest        # Apple Silicon (M1/M2/M3/M4)
            name: Mac-AppleSilicon
          - os: macos-15-intel      # older Intel Macs
            name: Mac-Intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Build
        run: python -m PyInstaller --noconfirm SupplementMaker.spec

      - name: Self-test packaged app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\Supplement Maker.exe" -ArgumentList "--selftest","selftest.pdf" -Wait -PassThru
          if ($p.ExitCode -ne 0 -or -not (Test-Path selftest.pdf)) { throw "self-test failed" }
          Compress-Archive -Path "dist\Supplement Maker.exe" -DestinationPath "Supplement-Maker-${{ matrix.name }}.zip"

      - name: Self-test packaged app (Mac)
        if: runner.os == 'macOS'
        run: |
          "dist/Supplement Maker.app/Contents/MacOS/Supplement Maker" --selftest selftest.pdf
          test -s selftest.pdf
          ditto -c -k --sequesterRsrc --keepParent "dist/Supplement Maker.app" "Supplement-Maker-${{ matrix.name }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Supplement-Maker-${{ matrix.name }}
          path: |
            Supplement-Maker-${{ matrix.name }}.zip
            selftest.pdf

  release:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: artifacts/**/*.zip
